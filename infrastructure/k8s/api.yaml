# FastAPI backend. Image is built from services/api/Dockerfile (exposes 8000,
# has a HEALTHCHECK against GET /health, runs as a non-root `app` user already).
#
# TODO: push a real image to a registry and replace the `image:` placeholder
# below (and in worker.yaml / beat.yaml, which share this same image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: teedesk
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: your-registry/teedesk-api:latest # TODO: replace
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: teedesk-config
            - secretRef:
                name: teedesk-secrets
          volumeMounts:
            - name: models-cache
              mountPath: /models_cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: models-cache
          persistentVolumeClaim:
            claimName: models-cache
---
# Shared HuggingFace / sentence-transformers cache, mirrors the `models_cache`
# named volume in docker-compose.prod.yml which is mounted by both api and
# (per this manifest set) worker.
#
# TODO: this PVC is mounted by both api (2 replicas) and worker, so it needs a
# storage class that supports ReadWriteMany (e.g. NFS, EFS, Filestore, Longhorn).
# If your cluster only offers ReadWriteOnce, either run api with 1 replica,
# give each Deployment its own PVC (accepting duplicate model downloads), or
# switch to emptyDir per-pod and accept a re-download on every pod restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-cache
  namespace: teedesk
spec:
  accessModes: ["ReadWriteMany"]
  # TODO: set storageClassName to one that supports the access mode above.
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: teedesk
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
