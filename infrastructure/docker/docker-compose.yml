# TeeDesk — Local Development Stack
# Start with: docker compose up -d

services:
  # PostgreSQL with pgvector extension for vector similarity search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: teedesk-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: teedesk
      POSTGRES_USER: teedesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teedesk_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teedesk']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — session cache, Celery broker, rate limiting
  redis:
    image: redis:7-alpine
    container_name: teedesk-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama — local LLM inference (OpenAI-compatible API)
  # Pull models: docker exec teedesk-ollama ollama pull mistral:7b-instruct
  ollama:
    image: ollama/ollama
    container_name: teedesk-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to use NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # FastAPI backend
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: teedesk-api
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - ../../services/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://teedesk:${POSTGRES_URL_PASSWORD:-teedesk_dev}@postgres:5432/teedesk
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      ENVIRONMENT: development
      RELOAD: 'true'
      # HuggingFace / sentence-transformers model cache (persisted via volume)
      HF_HOME: /models_cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models_cache/sentence_transformers
      TRANSFORMERS_CACHE: /models_cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/api:/app
      - models_cache:/models_cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # Celery worker — background jobs (retrain, etc.)
  worker:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: teedesk-worker
    restart: unless-stopped
    env_file:
      - ../../services/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://teedesk:${POSTGRES_URL_PASSWORD:-teedesk_dev}@postgres:5432/teedesk
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/api:/app
      - models_cache:/models_cache
    command: celery -A app.tasks.celery_app worker --loglevel=info

  # Celery beat — schedules the nightly retrain task. Single replica only.
  beat:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: teedesk-beat
    restart: unless-stopped
    env_file:
      - ../../services/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://teedesk:${POSTGRES_URL_PASSWORD:-teedesk_dev}@postgres:5432/teedesk
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/api:/app
    command: celery -A app.tasks.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  models_cache:

networks:
  default:
    name: teedesk-network
