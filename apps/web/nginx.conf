# Serves the Vite-built SPA with client-side routing fallback.
# API calls go to a separate `api` Service via the Ingress (see infrastructure/k8s/ingress.yaml),
# not through this nginx — this container only serves static assets.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
